<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Relé | Smart Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Borda superior iluminada */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header h1 i {
      color: #38bdf8;
    }

    /* Redes e Conexões (LEDs) */
    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .status-item {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .status-item span {
      font-size: 0.65rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .led-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #334155;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .led.on {
      background: #10b981;
      box-shadow: 0 0 12px #10b981, 0 0 24px rgba(16, 185, 129, 0.4);
    }

    .led.off {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }

    /* Mostrador de Estado */
    .estado-container {
      margin-bottom: 28px;
    }

    .estado-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(51, 65, 85, 0.4);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s;
    }

    .estado-badge.on {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .estado-badge.off {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* Botão Principal Cyberpunk */
    .btn-container {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 28px;
    }

    .btn-rele {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      outline: none;
      background: #1e293b;
      color: #64748b;
      font-size: 2rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05), 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.05);
    }

    .btn-rele:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(100%);
    }

    .btn-rele.ligado {
      background: radial-gradient(circle, #10b981 0%, #047857 100%);
      color: #ffffff;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      border-color: #34d399;
    }

    .btn-rele.desligado {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      color: #475569;
    }

    .btn-rele:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .btn-rele.ligado:hover:not(:disabled) {
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.4);
    }

    .btn-rele:active:not(:disabled) {
      transform: scale(0.95);
    }

    /* Painel de Informações */
    .info {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.7rem;
      color: #64748b;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .info-item {
      display: flex;
      justify-content: space-between;
    }

    .info-item code {
      color: #38bdf8;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1><i class="fa-solid fa-bolt"></i> Painel de Controle</h1>
    </div>

    <div class="status-row">
      <div class="status-item">
        <span>Web ↔ MQTT</span>
        <div class="led-wrapper">
          <div id="ledPage" class="led off"></div>
        </div>
      </div>
      <div class="status-item">
        <span>ESP32 ↔ MQTT</span>
        <div class="led-wrapper">
          <div id="ledEsp" class="led off"></div>
        </div>
      </div>
    </div>

    <div class="estado-container">
      <span id="txtEstado" class="estado-badge off">Aguardando...</span>
    </div>

    <div class="btn-container">
      <button id="btnRele" class="btn-rele desligado" disabled aria-label="Alternar Relé">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>

    <div class="info">
      <div class="info-item"><span>Broker:</span> <code>broker.emqx.io</code></div>
      <div class="info-item"><span>Cmd:</span> <code>casa/rele/cmd</code></div>
      <div class="info-item"><span>Status:</span> <code>casa/rele/status</code></div>
    </div>
  </div>

  <script>
    const BROKER       = "wss://broker.emqx.io:8084/mqtt";
    const TOPIC_STATUS = "casa/rele/status";
    const TOPIC_CMD    = "casa/rele/cmd";
    const CLIENT_ID    = "web_rele_" + Math.random().toString(16).substr(2, 8);

    let client = null;
    let estado = false;
    let ultimaMsg = 0;
    const TIMEOUT = 8000;

    const ledPage   = document.getElementById("ledPage");
    const ledEsp    = document.getElementById("ledEsp");
    const btnRele   = document.getElementById("btnRele");
    const txtEstado = document.getElementById("txtEstado");

    function atualizarBotao() {
      if (estado) {
        btnRele.classList.remove("desligado");
        btnRele.classList.add("ligado");
        
        txtEstado.textContent = "SISTEMA LIGADO";
        txtEstado.classList.remove("off");
        txtEstado.classList.add("on");
      } else {
        btnRele.classList.remove("ligado");
        btnRele.classList.add("desligado");
        
        txtEstado.textContent = "SISTEMA DESLIGADO";
        txtEstado.classList.remove("on");
        txtEstado.classList.add("off");
      }
    }

    function conectar() {
      client = mqtt.connect(BROKER, {
        clientId: CLIENT_ID,
        clean: true,
        reconnectPeriod: 3000
      });

      client.on("connect", () => {
        ledPage.classList.remove("off");
        ledPage.classList.add("on");
        client.subscribe(TOPIC_STATUS);
        btnRele.disabled = false;
      });

      client.on("reconnect", () => {
        ledPage.classList.remove("on");
        ledPage.classList.add("off");
        btnRele.disabled = true;
      });

      client.on("close", () => {
        ledPage.classList.remove("on");
        ledPage.classList.add("off");
        btnRele.disabled = true;
      });

      client.on("error", (err) => {
        console.error("Erro MQTT:", err);
      });

      client.on("message", (topic, message) => {
        if (topic === TOPIC_STATUS) {
          ultimaMsg = Date.now();
          ledEsp.classList.remove("off");
          ledEsp.classList.add("on");

          const payload = message.toString().toLowerCase().trim();
          estado = (payload === "on" || payload === "1" || payload === "true");

          atualizarBotao();
        }
      });
    }

    setInterval(() => {
      if (Date.now() - ultimaMsg > TIMEOUT) {
        ledEsp.classList.remove("on");
        ledEsp.classList.add("off");
      }
    }, 1500);

    btnRele.addEventListener("click", () => {
      if (!client || !client.connected) return;
      client.publish(TOPIC_CMD, "toggle");
    });

    conectar();
    atualizarBotao();
  </script>
</body>
</html>
