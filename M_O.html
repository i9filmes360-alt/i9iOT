<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Micro-ondas - Brastemp</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { 
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 50px 20px; /* Aumentado para 50px em cima e embaixo (~3cm) */
    }

    body:fullscreen {
      background: #1c1c1c;
      padding: 0;
    }
    
    body:fullscreen .remote {
      max-width: 100%;
      width: 100%;
      height: 100vh;
      border-radius: 0;
      padding: 5vh 4vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    body:fullscreen .screen {
      height: 25vh;
      font-size: 12vw;
    }
    
    body:fullscreen .btn-time {
      padding: 2vh 3vw;
      font-size: 4vw;
    }
    
    body:fullscreen .btn-nav {
      width: 18vw;
      height: 10vh;
      font-size: 8vw;
    }
    
    body:fullscreen .pause-btn,
    body:fullscreen .start-btn {
      width: 20vw;
      height: 12vh;
      font-size: 8vw;
    }
    
    body:fullscreen .smart-food {
      font-size: 5vw;
      padding: 2vh;
    }

    .remote {
      width: 100%;
      max-width: min(90vw, 450px);
      background: #1c1c1c;
      border-radius: clamp(20px, 8vw, 50px);
      padding: clamp(20px, 6vw, 40px) clamp(10px, 4vw, 20px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      border: 7px solid #111;
      transition: all 0.3s ease;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: clamp(15px, 4vh, 25px);
    }

    .brand {
      color: #00ffcc;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .brand small {
      font-size: clamp(11px, 3vw, 15px);
      letter-spacing: 1px;
      display: block;
      color: #ff6600;
      margin-top: 6px;
    }

    .status-bar {
      background: #0a0a0a;
      border-radius: clamp(10px, 2.5vw, 15px);
      padding: clamp(6px, 1.8vh, 10px);
      margin: clamp(8px, 2.5vh, 15px) clamp(8px, 3vw, 15px);
      font-size: clamp(9px, 2.5vw, 12px);
      color: #00ffcc;
      text-align: center;
      font-family: monospace;
    }

    .screen {
      background: #0a0a0a;
      height: clamp(110px, 28vh, 180px);
      border-radius: clamp(14px, 3.5vw, 22px);
      margin: clamp(15px, 4vh, 25px) clamp(8px, 3vw, 15px);
      border: 4px solid #333;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(48px, 13vw, 80px);
      font-weight: bold;
      color: #00ffcc;
      letter-spacing: 4px;
      transition: all 0.1s ease;
      overflow: hidden;
    }

    .screen .door-message {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: clamp(16px, 4.5vw, 24px);
      font-weight: bold;
      color: #ffaa00;
      text-align: center;
      letter-spacing: 1px;
      animation: pulseMessage 1s infinite;
      backdrop-filter: blur(2px);
      z-index: 10;
    }
    
    .screen .door-message span {
      font-size: clamp(34px, 11vw, 55px);
      margin-bottom: 10px;
    }
    
    @keyframes pulseMessage {
      0% { opacity: 1; background: rgba(0, 0, 0, 0.95); }
      50% { opacity: 0.9; background: rgba(0, 0, 0, 0.9); }
      100% { opacity: 1; background: rgba(0, 0, 0, 0.95); }
    }

    .screen::after {
      content: "ATIVE!";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffcc;
      font-size: clamp(18px, 5.5vw, 32px);
      opacity: 0.08;
      pointer-events: none;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .screen.flash {
      animation: flashText 0.3s ease-in-out 3;
    }

    @keyframes flashText {
      0% { opacity: 1; text-shadow: 0 0 0 #00ffcc; }
      50% { opacity: 0.7; text-shadow: 0 0 15px #00ffcc; color: #fff; }
      100% { opacity: 1; text-shadow: 0 0 0 #00ffcc; }
    }

    .colon {
      animation: blink 1s step-start infinite;
      display: inline-block;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .buttons { padding: clamp(8px, 2.5vh, 15px) clamp(5px, 2vw, 10px); }

    .smart-food {
      background: linear-gradient(135deg, #6b00ff, #c300ff);
      color: white;
      text-align: center;
      padding: clamp(12px, 3.5vh, 20px);
      border-radius: clamp(28px, 7vw, 45px);
      font-size: clamp(16px, 5vw, 22px);
      font-weight: bold;
      margin: clamp(12px, 3.5vh, 22px) 0 clamp(15px, 4.5vh, 28px) 0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .smart-food:active {
      transform: scale(0.98);
    }

    .time-buttons {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 3.5vw, 18px);
      margin-bottom: clamp(18px, 5vh, 30px);
    }

    .btn-time {
      background: #ff3333;
      color: white;
      padding: clamp(12px, 3vh, 18px) clamp(14px, 4.5vw, 26px);
      border-radius: 50px;
      font-weight: bold;
      font-size: clamp(14px, 4.5vw, 20px);
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    .btn-time:active { transform: scale(0.96); }
    .btn-time.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: clamp(35px, 12vw, 70px);
      margin: clamp(15px, 4vh, 25px) 0 clamp(18px, 5vh, 30px) 0;
    }

    .btn-nav {
      background: #333;
      color: white;
      width: clamp(65px, 20vw, 100px);
      height: clamp(50px, 12vh, 70px);
      border-radius: clamp(28px, 7vw, 45px);
      font-size: clamp(32px, 9vw, 50px);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-nav:active { background: #555; }
    .btn-nav.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .bottom-controls {
      display: flex;
      justify-content: center;
      gap: clamp(30px, 10vw, 55px);
      margin-top: clamp(10px, 3vh, 20px);
    }

    .pause-btn {
      background: #e0e0e0;
      color: #1c1c1c;
      width: clamp(75px, 22vw, 110px);
      height: clamp(55px, 13vh, 80px);
      border-radius: clamp(28px, 7vw, 45px);
      font-size: clamp(24px, 7vw, 38px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pause-btn:active { background: #ccc; }
    .pause-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .start-btn {
      background: #e74c3c;
      color: white;
      width: clamp(75px, 22vw, 110px);
      height: clamp(55px, 13vh, 80px);
      border-radius: clamp(28px, 7vw, 45px);
      font-size: clamp(32px, 8vw, 45px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .start-btn:active { background: #c0392b; }
    .start-btn.disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.5;
      pointer-events: none;
    }

    .bottom-labels {
      display: flex;
      justify-content: center;
      gap: clamp(30px, 10vw, 55px);
      margin-top: clamp(8px, 2vh, 15px);
    }

    .label {
      font-size: clamp(10px, 2.8vw, 13px);
      color: #aaaaaa;
      text-align: center;
      width: clamp(75px, 22vw, 110px);
    }
  </style>
</head>
<body>

  <div class="remote">
    <div class="header">
      <div class="brand">
        MICRO-ONDAS
        <small>systema Marcondes</small>
      </div>
    </div>

    <div id="mqttStatus" class="status-bar">🔄 Conectando MQTT...</div>
    
    <div id="display" class="screen">
      <div id="doorMessage" class="door-message" style="display: none;">
        <span>🚪</span>
        PORTA ABERTA!
      </div>
      00:00
    </div>

    <div class="buttons">
      <div id="smartFoodBtn" class="smart-food">smart food</div>

      <div class="time-buttons">
        <button class="btn-time" data-time="300">+5 min</button>
        <button class="btn-time" data-time="60">+1 min</button>
        <button class="btn-time" data-time="30">+30 seg</button>
      </div>

      <div class="nav-buttons">
        <button id="minusBtn" class="btn-nav">−</button>
        <button id="plusBtn" class="btn-nav">+</button>
      </div>

      <div class="bottom-controls">
        <button id="pauseBtn" class="pause-btn">⏸</button>
        <button id="startBtn" class="start-btn">▶</button>
      </div>

      <div class="bottom-labels">
        <div class="label">pausar / cancelar</div>
        <div class="label">iniciar</div>
      </div>
    </div>
  </div>

  <script>
    // ==================== CONFIGURAÇÕES MQTT ====================
    const MQTT_CONFIG = {
        broker: 'ws://broker.emqx.io:8083/mqtt',
        topics: {
            micro: 'wellguard/v10/relay/micro',
            status: 'wellguard/v10/status',
            door: 'wellguard/v10/door'
        },
        deviceID: 'web_controle_' + Math.random().toString(36).substr(2, 6)
    };

    let mqttClient = null;

    // ==================== ESTADO ====================
    let timeLeft = 0;           
    let timerInterval = null;   
    let isPaused = false;       
    let isActive = true;
    let clockInterval = null;
    let beepInterval = null;
    let isDoorOpen = false;
    let doorPaused = false;
    
    // ==================== CONTROLE DE EXIBIÇÃO ====================
    let tempMessageTimeout = null;
    let isTempMessageShowing = false;
    let pauseMessageActive = false;
    
    // ==================== ELEMENTOS ====================
    const display = document.getElementById('display');
    const doorMessage = document.getElementById('doorMessage');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const smartFoodBtn = document.getElementById('smartFoodBtn');
    const mqttStatusEl = document.getElementById('mqttStatus');

    // ==================== FUNÇÕES MQTT ====================
    function connectMQTT() {
        try {
            mqttClient = mqtt.connect(MQTT_CONFIG.broker);
            
            mqttClient.on('connect', () => {
                console.log('✓ Conectado ao broker MQTT');
                mqttStatusEl.innerHTML = '✅ MQTT Conectado';
                mqttStatusEl.style.color = '#00ffcc';
                
                mqttClient.subscribe(MQTT_CONFIG.topics.status);
                mqttClient.subscribe(MQTT_CONFIG.topics.door);
            });
            
            mqttClient.on('message', (topic, message) => {
                const msg = message.toString();
                console.log(`Mensagem recebida [${topic}]: ${msg}`);
                
                if (topic === MQTT_CONFIG.topics.door) {
                    const wasOpen = isDoorOpen;
                    isDoorOpen = (msg === "OPEN");
                    
                    if (!wasOpen && isDoorOpen) {
                        if (timerInterval !== null && !isPaused && timeLeft > 0) {
                            doorPaused = true;
                            manualPause();
                        }
                        updateDoorMessage();
                    } else if (wasOpen && !isDoorOpen) {
                        if (doorPaused && timeLeft > 0) {
                            doorPaused = false;
                            manualResume();
                        }
                        updateDoorMessage();
                    }
                }
            });
            
            mqttClient.on('error', (err) => {
                console.error('Erro MQTT:', err);
                mqttStatusEl.innerHTML = '❌ Erro MQTT';
                mqttStatusEl.style.color = '#ff3333';
            });
            
            mqttClient.on('offline', () => {
                console.log('Cliente MQTT offline');
                mqttStatusEl.innerHTML = '🔴 MQTT Desconectado';
                mqttStatusEl.style.color = '#ff3333';
            });
            
        } catch(e) {
            console.error('Erro ao conectar MQTT:', e);
            mqttStatusEl.innerHTML = '❌ Falha na conexão';
            mqttStatusEl.style.color = '#ff3333';
        }
    }
    
    function sendMQTTCommand(topic, command) {
        if (mqttClient && mqttClient.connected) {
            mqttClient.publish(topic, command);
            console.log(`📤 Comando enviado: ${topic} = ${command}`);
        } else {
            console.warn('MQTT não conectado!');
        }
    }
    
    function controlMicro(state) {
        const command = state ? 'ON' : 'OFF';
        sendMQTTCommand(MQTT_CONFIG.topics.micro, command);
    }
    
    function updateRelays() {
        const isCountingActive = (timerInterval !== null && !isPaused && timeLeft > 0 && !isDoorOpen);
        
        if (isCountingActive && isActive) {
            controlMicro(true);
        } else {
            controlMicro(false);
        }
    }
    
    function updateDoorMessage() {
        if (isDoorOpen) {
            doorMessage.style.display = 'flex';
            startBtn.classList.add('disabled');
            document.querySelectorAll('.btn-time').forEach(btn => btn.classList.add('disabled'));
            document.getElementById('plusBtn').classList.add('disabled');
            document.getElementById('minusBtn').classList.add('disabled');
        } else {
            doorMessage.style.display = 'none';
            startBtn.classList.remove('disabled');
            document.querySelectorAll('.btn-time').forEach(btn => btn.classList.remove('disabled'));
            document.getElementById('plusBtn').classList.remove('disabled');
            document.getElementById('minusBtn').classList.remove('disabled');
        }
    }
    
    function manualPause() {
        if (timerInterval !== null && !isPaused) {
            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = true;
            controlMicro(false);
            showPauseMessagePermanent();
        }
    }
    
    function manualResume() {
        if (isPaused && timeLeft > 0 && !isDoorOpen) {
            isPaused = false;
            hidePauseMessage();
            startTimer();
        }
    }
    
    function cancelAll() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        
        isPaused = false;
        doorPaused = false;
        timeLeft = 0;
        
        controlMicro(false);
        stopBeep();
        hidePauseMessage();
        startClock();
        updateDisplay();
    }

    // ==================== FUNÇÃO FULLSCREEN ====================
    function toggleFullscreen() {
      const doc = document.documentElement;
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      
      if (!isFullscreen) {
        const requestFullscreen = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
        if (requestFullscreen) {
          requestFullscreen.call(doc);
        }
      } else {
        const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (exitFullscreen) {
          exitFullscreen.call(document);
        }
      }
    }

    // ==================== ÁUDIO ====================
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep() {
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(1000, audioContext.currentTime);
      gain.gain.setValueAtTime(0.3, audioContext.currentTime);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      setTimeout(() => oscillator.stop(), 150);
    }

    function startBeep() {
      if (beepInterval) clearInterval(beepInterval);
      beepInterval = setInterval(playBeep, 600);
    }

    function stopBeep() {
      if (beepInterval) {
        clearInterval(beepInterval);
        beepInterval = null;
      }
    }

    // ==================== FORMATAÇÃO COM DOIS PONTOS ====================
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      return `${min.toString().padStart(2, '0')}<span class="colon">:</span>${sec.toString().padStart(2, '0')}`;
    }

    function formatClock(hours, minutes) {
      return `${hours.toString().padStart(2, '0')}<span class="colon">:</span>${minutes.toString().padStart(2, '0')}`;
    }

    function showClock() {
      if (timeLeft > 0 || timerInterval || isTempMessageShowing || pauseMessageActive || isDoorOpen) return;
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      display.innerHTML = formatClock(h, m);
    }

    function startClock() {
      if (clockInterval) clearInterval(clockInterval);
      clockInterval = setInterval(showClock, 1000);
      showClock();
    }

    function stopClock() {
      if (clockInterval) clearInterval(clockInterval);
      clockInterval = null;
    }

    // ==================== EXIBIÇÃO DO DISPLAY ====================
    function restoreDisplay() {
      if (isTempMessageShowing) return;
      if (pauseMessageActive) return;
      if (isDoorOpen) return;
      if (timeLeft > 0) {
        display.innerHTML = formatTime(timeLeft);
      } else {
        const now = new Date();
        const h = now.getHours().toString().padStart(2, '0');
        const m = now.getMinutes().toString().padStart(2, '0');
        display.innerHTML = formatClock(h, m);
      }
    }

    function showTempMessage(message, isFlashing = false) {
      if (pauseMessageActive) return;
      if (isDoorOpen) return;
      
      if (tempMessageTimeout) {
        clearTimeout(tempMessageTimeout);
      }
      
      isTempMessageShowing = true;
      display.classList.remove('flash');
      display.innerHTML = message;
      display.style.fontSize = "clamp(32px, 9vw, 55px)";
      
      if (isFlashing) {
        void display.offsetWidth;
        display.classList.add('flash');
        setTimeout(() => {
          display.classList.remove('flash');
        }, 900);
      }
      
      tempMessageTimeout = setTimeout(() => {
        isTempMessageShowing = false;
        display.style.fontSize = "clamp(48px, 13vw, 80px)";
        restoreDisplay();
        tempMessageTimeout = null;
      }, 1000);
    }
    
    function showPauseMessagePermanent() {
      if (tempMessageTimeout) {
        clearTimeout(tempMessageTimeout);
        tempMessageTimeout = null;
      }
      isTempMessageShowing = false;
      pauseMessageActive = true;
      display.classList.remove('flash');
      display.innerHTML = "PAUSA";
      display.style.fontSize = "clamp(36px, 10vw, 60px)";
    }
    
    function hidePauseMessage() {
      if (pauseMessageActive) {
        pauseMessageActive = false;
        display.style.fontSize = "clamp(48px, 13vw, 80px)";
        restoreDisplay();
      }
    }

    function updateDisplay() {
      if (isTempMessageShowing) return;
      if (pauseMessageActive) return;
      if (isDoorOpen) return;
      if (timeLeft > 0) {
        display.innerHTML = formatTime(timeLeft);
      } else {
        showClock();
      }
    }

    // ==================== TIMER PRINCIPAL ====================
    function startTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      if (timeLeft <= 0) {
        showTempMessage("AJUSTE O TEMPO!", true);
        return;
      }
      if (isDoorOpen) {
        showTempMessage("PORTA ABERTA!", true);
        return;
      }
      
      stopClock();
      stopBeep();
      hidePauseMessage();
      
      timerInterval = setInterval(() => {
        if (!isPaused && timeLeft > 0 && !isDoorOpen) {
          timeLeft--;
          if (!isTempMessageShowing && !pauseMessageActive) {
            display.innerHTML = formatTime(timeLeft);
          }
          
          if (timeLeft === 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            isPaused = false;
            doorPaused = false;
            startBeep();
            startClock();
            hidePauseMessage();
            updateDisplay();
            updateRelays();
          } else {
            updateRelays();
          }
        }
      }, 1000);
      
      updateRelays();
    }

    function manualPauseOrCancel() {
      if (beepInterval) {
        stopBeep();
        timeLeft = 0;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        isPaused = false;
        doorPaused = false;
        hidePauseMessage();
        startClock();
        updateDisplay();
        updateRelays();
        return;
      }
      
      if (timerInterval !== null || isPaused) {
        if (!isPaused) {
          clearInterval(timerInterval);
          timerInterval = null;
          isPaused = true;
          showPauseMessagePermanent();
          updateRelays();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          timeLeft = 0;
          isPaused = false;
          doorPaused = false;
          stopBeep();
          hidePauseMessage();
          startClock();
          updateDisplay();
          updateRelays();
        }
      } else {
        if (timeLeft !== 0) {
          timeLeft = 0;
          updateDisplay();
        }
        stopBeep();
        hidePauseMessage();
        startClock();
        updateRelays();
      }
    }

    function activateTimerMode() {
      stopClock();
      stopBeep();
    }

    // ==================== EVENT LISTENERS ====================
    
    document.querySelectorAll('.btn-time').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isDoorOpen) {
          showTempMessage("PORTA ABERTA!", true);
          return;
        }
        const increment = parseInt(btn.dataset.time);
        if (isNaN(increment)) return;
        activateTimerMode();
        timeLeft += increment;
        if (!pauseMessageActive) {
          updateDisplay();
        }
      });
    });

    document.getElementById('plusBtn').addEventListener('click', () => {
      if (isDoorOpen) {
        showTempMessage("PORTA ABERTA!", true);
        return;
      }
      activateTimerMode();
      timeLeft += 10;
      if (!pauseMessageActive) {
        updateDisplay();
      }
    });

    document.getElementById('minusBtn').addEventListener('click', () => {
      if (isDoorOpen) {
        showTempMessage("PORTA ABERTA!", true);
        return;
      }
      activateTimerMode();
      if (timeLeft >= 10) timeLeft -= 10;
      else if (timeLeft > 0 && timeLeft < 10) timeLeft = 0;
      if (!pauseMessageActive) {
        updateDisplay();
      }
      if (timeLeft === 0 && timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        isPaused = false;
        doorPaused = false;
        stopBeep();
        hidePauseMessage();
        startClock();
        updateDisplay();
        updateRelays();
      }
    });

    startBtn.addEventListener('click', () => {
      if (isDoorOpen) {
        showTempMessage("PORTA ABERTA!", true);
        return;
      }
      if (timeLeft <= 0) {
        showTempMessage("AJUSTE O TEMPO!", true);
        return;
      }
      
      if (timerInterval !== null && !isPaused) return;
      
      if ((timerInterval === null && isPaused) || (doorPaused && isPaused)) {
        isPaused = false;
        doorPaused = false;
        hidePauseMessage();
        startTimer();
        return;
      }
      
      if (timerInterval === null && !isPaused && timeLeft > 0) {
        isPaused = false;
        doorPaused = false;
        hidePauseMessage();
        startTimer();
      }
    });

    pauseBtn.addEventListener('click', () => {
      if (isDoorOpen) return;
      manualPauseOrCancel();
    });

    // ==================== SMART FOOD - FULLSCREEN ====================
    smartFoodBtn.addEventListener('click', () => {
      toggleFullscreen();
    });

    // ==================== INICIALIZAÇÃO ====================
    connectMQTT();
    startClock();
    
    const resumeAudioOnFirstClick = () => {
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      document.removeEventListener('click', resumeAudioOnFirstClick);
    };
    document.addEventListener('click', resumeAudioOnFirstClick);
    
    function stopBeepOnAnyAction() {
      if (beepInterval) {
        stopBeep();
        if (timeLeft === 0 && timerInterval === null) {
          startClock();
          hidePauseMessage();
          updateDisplay();
          updateRelays();
        }
      }
    }
    
    const allInteractive = [startBtn, pauseBtn, smartFoodBtn, ...document.querySelectorAll('.btn-time'), document.getElementById('plusBtn'), document.getElementById('minusBtn')];
    allInteractive.forEach(el => {
      if (el) el.addEventListener('click', stopBeepOnAnyAction);
    });

    setInterval(() => {
      if (mqttClient && !mqttClient.connected) {
        console.log("Tentando reconectar MQTT...");
        connectMQTT();
      }
    }, 30000);
  </script>
</body>
</html>
