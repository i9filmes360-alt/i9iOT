<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EVA RADAR RF - Dashboard MQTT</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 80%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
    header {
      background: var(--card);
      padding: 12px 16px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    h1 { font-size: 1.1rem; color: var(--accent); font-weight: 700; }
    
    .status-badge {
      display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted);
      background: #0f172a; padding: 6px 12px; border-radius: 20px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #334155; }
    .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .grid-main { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 768px) { .grid-main { grid-template-columns: 320px 1fr; } }

    .card {
      background: var(--card); border-radius: 16px; padding: 16px;
      box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.05);
    }
    .card h2 { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

    .leds { display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 12px; margin-bottom: 12px; }
    .led-box { text-align: center; font-size: 0.65rem; color: var(--muted); }
    .led { width: 18px; height: 18px; border-radius: 50%; background: #334155; margin: 0 auto 4px; transition: all 0.3s; }
    .led.green.active { background: var(--green); box-shadow: 0 0 12px var(--green); }
    .led.yellow.active { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
    .led.red.active { background: var(--red); box-shadow: 0 0 12px var(--red); }

    .metric { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; }
    .metric span:last-child { font-weight: 700; color: var(--accent); }

    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; }
    .form-group select, .form-group input {
      width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.8rem;
    }
    
    .btn {
      width: 100%; background: var(--accent); color: #000; border: none; padding: 10px;
      border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; font-size: 0.8rem;
    }
    .btn:active { opacity: 0.8; }

    .chart-card { min-height: 320px; display: flex; flex-direction: column; }
    .chart-box { flex: 1; position: relative; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>EVA RADAR RF</h1>
      <div class="status-badge">
        <div id="dotWeb" class="dot"></div>
        <span id="txtWeb">Conectando...</span>
      </div>
    </header>

    <div class="grid-main">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="card">
          <h2>Status do Sistema</h2>
          <div class="leds">
            <div class="led-box"><div id="ledVerde" class="led green"></div>AUSENTE</div>
            <div class="led-box"><div id="ledAmarelo" class="led yellow"></div>SUSPEITA</div>
            <div class="led-box"><div id="ledVermelho" class="led red"></div>PRESENÇA</div>
          </div>

          <div class="metric"><span>Fonte Sinal:</span><span id="valModo">--</span></div>
          <div class="metric"><span>RSSI Atual:</span><span id="valRssi">0 dBm</span></div>
          <div class="metric"><span>Referência:</span><span id="valRef">0 dBm</span></div>
          <div class="metric"><span>Delta:</span><span id="valDelta">0 dB</span></div>
          <div class="metric"><span>Estado:</span><span id="valEstado">OFFLINE</span></div>
        </div>

        <div class="card">
          <h2>Ajustes Remotos</h2>
          
          <div class="form-group">
            <label>Fonte de Sinal RSSI:</label>
            <select id="cfgFonteSinal">
              <option value="TX">ESP32 TX (Pacotes UDP)</option>
              <option value="WIFI">Wi-Fi Local (Roteador)</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <div class="form-group">
              <label>Limiar Ent. (dBm):</label>
              <input type="number" step="0.1" id="cfgEntrada" value="3.5">
            </div>
            <div class="form-group">
              <label>Limiar Saída (dBm):</label>
              <input type="number" step="0.1" id="cfgSaida" value="1.8">
            </div>
          </div>

          <button class="btn" onclick="enviarConfiguracao()">Aplicar Configuração</button>
        </div>
      </div>

      <div class="card chart-card">
        <h2>Sinal RF em Tempo Real</h2>
        <div class="chart-box">
          <canvas id="chartRssi"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuração do Gráfico Chart.js
    const ctx = document.getElementById('chartRssi').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'RSSI Filtrado (dBm)', borderColor: '#38bdf8', data: [], tension: 0.2, pointRadius: 2 },
          { label: 'Referência (dBm)', borderColor: '#eab308', borderDash: [4, 4], data: [], pointRadius: 0 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#f8fafc', boxWidth: 10, font: { size: 10 } } } },
        scales: {
          x: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: '#1e293b' } },
          y: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: '#334155' } }
        }
      }
    });

    // Conexão MQTT via WebSockets
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "web_radar_" + Math.random().toString(16).substr(2, 8)
    });

    const topicData = "casa/radar/data";
    const topicCmd  = "casa/radar/cmd";

    client.on("connect", () => {
      document.getElementById('dotWeb').className = "dot online";
      document.getElementById('txtWeb').textContent = "Online";
      
      // Assina os dois tópicos: Dados do Radar e Comandos de Controle
      client.subscribe(topicData);
      client.subscribe(topicCmd);
    });

    client.on("message", (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        
        // 1. Recebimento de TELEMETRIA (atualiza gráficos e cards)
        if (topic === topicData) {
          document.getElementById('valModo').innerText  = data.fonte || "TX";
          document.getElementById('valRssi').innerText  = data.rssi.toFixed(1) + " dBm";
          document.getElementById('valRef').innerText   = data.ref.toFixed(1) + " dBm";
          document.getElementById('valDelta').innerText = data.delta.toFixed(1) + " dB";
          document.getElementById('valEstado').innerText= data.estado;

          document.getElementById('ledVerde').className = 'led green' + (data.estado === 'AUSENTE' ? ' active' : '');
          document.getElementById('ledAmarelo').className = 'led yellow' + (data.estado === 'CALIBRANDO' || data.estado === 'SUSPEITA' ? ' active' : '');
          document.getElementById('ledVermelho').className = 'led red' + (data.estado === 'PRESENCA' ? ' active' : '');

          let hora = new Date().toLocaleTimeString();
          if (chart.data.labels.length > 25) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
            chart.data.datasets[1].data.shift();
          }
          chart.data.labels.push(hora);
          chart.data.datasets[0].data.push(data.rssi);
          chart.data.datasets[1].data.push(data.ref);
          chart.update('none');
        } 
        
        // 2. Recebimento de COMANDOS (Espelhamento nos outros dispositivos)
        else if (topic === topicCmd) {
          if (data.fonte !== undefined) {
            document.getElementById('cfgFonteSinal').value = data.fonte;
          }
          if (data.limiarEntrada !== undefined) {
            document.getElementById('cfgEntrada').value = data.limiarEntrada;
          }
          if (data.limiarSaida !== undefined) {
            document.getElementById('cfgSaida').value = data.limiarSaida;
          }
        }
      } catch (e) { console.error(e); }
    });

    // Publica alterações e sincroniza telas
    function enviarConfiguracao() {
      const fonte = document.getElementById('cfgFonteSinal').value;
      const ent   = parseFloat(document.getElementById('cfgEntrada').value);
      const sai   = parseFloat(document.getElementById('cfgSaida').value);
      
      const cmd = JSON.stringify({
        fonte: fonte,
        limiarEntrada: ent,
        limiarSaida: sai
      });
      
      client.publish(topicCmd, cmd);
    }
  </script>
</body>
</html>
