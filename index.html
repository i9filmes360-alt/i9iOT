
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
                                     initial-scale=1.0, 
                                     maximum-scale=1.0, 
                                     user-scalable=no">
    <title>WellGuard PRO X - v10.2 Control</title>
    
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0a0b;
            --card: #141416;
            --vis-bg: #080808;
            --cyan: #00f5ff;
            --purple: #8b00ff;
            --red: #ff2d55;
            --green: #00ff9d;
            --btn-gray: #1f1f22;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: #ddd; 
            padding: 5px; 
            display: flex; 
            justify-content: center; 
        }
        
        .container { 
            width: 100%; 
            max-width: 1000px; 
            background: var(--card); 
            border-radius: 15px; 
            overflow: hidden; 
            border: 1px solid #222; 
            display: flex; 
            flex-direction: column; 
        }
        
        .header { 
            background: #0d0d0f; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #222; 
        }
        
        .header h1 { 
            font-size: 0.85rem; 
            font-weight: 900; 
            color: var(--cyan); 
            letter-spacing: 1px; 
        }
        
        .status-area { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        
        .led-group { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        
        .led-item { 
            font-size: 0.5rem; 
            color: #666; 
            text-align: center; 
        }
        
        .led { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: #222; 
            margin: 0 auto 2px; 
            border: 1px solid #000; 
        }
        
        #webLed.online { 
            background: var(--cyan); 
            box-shadow: 0 0 8px var(--cyan); 
        }
        
        #espLed.online { 
            background: var(--green); 
            box-shadow: 0 0 8px var(--green); 
        }

        .instrument-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            padding: 10px; 
        }
        
        .instrument { 
            background: #18181a; 
            border-radius: 12px; 
            padding: 10px; 
            border: 1px solid #252525; 
            display: flex; 
            flex-direction: column; 
        }
        
        .label { 
            font-size: 0.6rem; 
            color: #888; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            font-weight: 600; 
        }
        
        .visor-interno { 
            background: var(--vis-bg); 
            border-radius: 8px; 
            padding: 5px 10px; 
            margin-bottom: 5px; 
            border-top: 1px solid #000; 
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5); 
        }
        
        .display { 
            font-size: 1.6rem; 
            font-weight: 700; 
            font-family: 'Courier New', monospace; 
            color: var(--cyan); 
            text-align: right; 
        }
        
        .bar-wrap { 
            height: 6px; 
            background: #1a1a1a; 
            border-radius: 3px; 
            overflow: hidden; 
            margin-top: 5px; 
        }
        
        .bar-fill { 
            height: 100%; 
            width: 0%; 
            transition: width 0.3s ease; 
        }

        .card-controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 5px; 
        }
        
        .alarm { 
            width: 14px; 
            height: 14px; 
            border-radius: 50%; 
            background: #111; 
            border: 1px solid #000; 
        }
        
        .alarm-on { 
            background: var(--red); 
            box-shadow: 0 0 10px var(--red); 
            animation: pulse 1s infinite; 
        }
        
        @keyframes pulse { 
            50% { opacity: 0.5; } 
        }

        .btn-toggle { 
            padding: 4px 8px; 
            font-size: 0.55rem; 
            background: #1f1f22; 
            color: #fff; 
            border: 1px solid #333; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
            min-width: 40px; 
            transition: all 0.2s ease;
        }
        
        .btn-off { 
            background: var(--red) !important; 
        }

        .footer-btns { 
            padding: 10px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
        }
        
        button.btn-main { 
            padding: 10px; 
            font-weight: 700; 
            border-radius: 8px; 
            border: 1px solid #2a2a2a; 
            cursor: pointer; 
            font-size: 0.65rem; 
            background: var(--btn-gray); 
            color: #bbb; 
            transition: all 0.2s ease;
        }
        
        button.btn-main:hover {
            background: #2a2a2e;
            color: #fff;
        }

        #muteBtn.muted {
            background: #ff2d55;
            color: white;
            animation: pulse 0.5s infinite;
        }
        
        #muteBtn.unmuted {
            background: var(--green);
            color: #000;
        }

        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.9); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }
        
        .modal-content { 
            background: #141416; 
            padding: 20px; 
            border-radius: 15px; 
            width: 85%; 
            max-width: 320px; 
            border: 1px solid #333; 
        }
        
        input { 
            width: 100%; 
            padding: 8px; 
            background: #080808; 
            border: 1px solid #2a2a2a; 
            color: var(--cyan); 
            margin-bottom: 8px; 
            border-radius: 5px; 
            outline: none; 
        }
        
        label { 
            font-size: 0.6rem; 
            color: #888; 
            display: block; 
            margin-top: 5px; 
        }

        .status-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            color: var(--cyan);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.75rem;
            z-index: 1000;
            font-family: monospace;
            border-left: 3px solid var(--cyan);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>WELLGUARD PRO X</h1>
        <div class="status-area">
            <button onclick="toggleFullScreen()" class="btn-main" style="padding: 5px 10px;">⛶</button>
            
            <div class="led-group">
                <div class="led-item">
                    <div id="webLed" class="led"></div>
                    WEB
                </div>
                <div class="led-item">
                    <div id="espLed" class="led"></div>
                    ESP
                </div>
            </div>
            
            <button id="muteBtn" onclick="toggleMute()" class="btn-main" style="padding: 5px 8px;">🔊 MUTE</button>
        </div>
    </div>

    <div class="instrument-grid">
        <!-- SENSOR 1: GÁS -->
        <div class="instrument">
            <div class="label">GÁS (PPM)</div>
            <div class="visor-interno">
                <div class="display" id="gasV">0000</div>
                <div class="bar-wrap">
                    <div id="gasB" class="bar-fill"></div>
                </div>
            </div>
            <div class="card-controls">
                <button id="gasTgl" onclick="toggleSensor('gas')" class="btn-toggle">ON</button>
                <div id="gasA" class="alarm"></div>
            </div>
        </div>

        <!-- SENSOR 2: TEMPERATURA -->
        <div class="instrument">
            <div class="label">TEMP (°C)</div>
            <div class="visor-interno">
                <div class="display" id="tempV">0.0</div>
                <div class="bar-wrap">
                    <div id="tempB" class="bar-fill"></div>
                </div>
            </div>
            <div class="card-controls">
                <button id="tempTgl" onclick="toggleSensor('temp')" class="btn-toggle">ON</button>
                <div id="tempA" class="alarm"></div>
            </div>
        </div>

        <!-- SENSOR 3: VAZÃO -->
        <div class="instrument">
            <div class="label">VAZÃO (L/M)</div>
            <div class="visor-interno">
                <div class="display" id="flowV">0.0</div>
                <div class="bar-wrap">
                    <div id="flowB" class="bar-fill"></div>
                </div>
            </div>
            <div class="card-controls">
                <button id="flowTgl" onclick="toggleSensor('flow')" class="btn-toggle">ON</button>
                <div id="flowA" class="alarm"></div>
            </div>
        </div>

        <!-- SENSOR 4: PRESSÃO -->
        <div class="instrument">
            <div class="label">PRESS (BAR)</div>
            <div class="visor-interno">
                <div class="display" id="pressV">0.00</div>
                <div class="bar-wrap">
                    <div id="pressB" class="bar-fill"></div>
                </div>
            </div>
            <div class="card-controls">
                <button id="pressTgl" onclick="toggleSensor('press')" class="btn-toggle">ON</button>
                <div id="pressA" class="alarm"></div>
            </div>
        </div>

        <!-- SENSOR 5: NÍVEL -->
        <div class="instrument">
            <div class="label">NÍVEL (%)</div>
            <div class="visor-interno">
                <div class="display" id="nivelV">0.0</div>
                <div class="bar-wrap">
                    <div id="nivelB" class="bar-fill"></div>
                </div>
            </div>
            <div class="card-controls">
                <button id="nivelTgl" onclick="toggleSensor('nivel')" class="btn-toggle">ON</button>
                <div id="nivelA" class="alarm"></div>
            </div>
        </div>

        <!-- SENSOR 6: PRESENÇA -->
        <div class="instrument">
            <div class="label">PRESENÇA</div>
            <div class="visor-interno">
                <div class="display" id="presV" style="text-align:center; font-size: 1.1rem;">OK</div>
            </div>
            <div class="card-controls">
                <button id="presTgl" onclick="toggleSensor('pres')" class="btn-toggle">ON</button>
                <div id="presA" class="alarm"></div>
            </div>
        </div>
    </div>

    <div class="footer-btns">
        <button class="btn-main" onclick="generatePDF()">📄 PDF</button>
        <button class="btn-main" onclick="document.getElementById('modal').style.display='flex'">⚙️ CONFIG</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h4 style="color:var(--cyan); margin-bottom:10px; text-align:center;">PARÂMETROS</h4>
        <label>SP GÁS</label><input type="number" id="s1">
        <label>SP TEMP</label><input type="number" id="s2">
        <label>SP VAZÃO</label><input type="number" id="s3">
        <label>SP PRESS</label><input type="number" id="s4" step="0.1">
        <label>SP NÍVEL</label><input type="number" id="s5">
        <label>ZERO GÁS</label><input type="number" id="s6">
        <button onclick="save()" style="background:var(--purple); color:white; width:100%; margin-top:5px; padding:10px; border-radius:5px;">SALVAR</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="background:none; color:#888; width:100%; margin-top:5px; border:none;">VOLTAR</button>
    </div>
</div>

<div id="statusMsg" class="status-msg" style="display: none;"></div>

<script>
// ============================================
// CONEXÃO MQTT
// ============================================
const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt");

let espTimeout = null;
let audioCtx = null;
let sirenInterval = null;
let isMuted = false;

// Estado dos sensores (ON/OFF) - INICIA COM TRUE (LIGADO)
const sensorEnabled = {
    gas: true,
    temp: true,
    flow: true,
    press: true,
    nivel: true,
    pres: true
};

// ============================================
// FUNÇÃO: showStatusMessage
// ============================================
function showStatusMessage(msg, isError = false) {
    const statusDiv = document.getElementById('statusMsg');
    statusDiv.textContent = msg;
    statusDiv.style.color = isError ? '#ff2d55' : '#00ff9d';
    statusDiv.style.display = 'block';
    setTimeout(() => {
        statusDiv.style.display = 'none';
    }, 3000);
}

// ============================================
// FUNÇÃO: toggleMute
// ============================================
function toggleMute() {
    isMuted = !isMuted;
    const muteBtn = document.getElementById('muteBtn');
    
    if (isMuted) {
        muteBtn.innerHTML = '🔇 MUTED';
        muteBtn.classList.add('muted');
        muteBtn.classList.remove('unmuted');
        
        if (sirenInterval) { 
            clearInterval(sirenInterval); 
            sirenInterval = null; 
        }
        
        client.publish('casa/set/mute', '1');
        showStatusMessage('🔇 ALARME SILENCIADO', false);
        console.log('🔇 MUTE ATIVADO - casa/set/mute = 1');
        
    } else {
        muteBtn.innerHTML = '🔊 MUTE';
        muteBtn.classList.remove('muted');
        muteBtn.classList.add('unmuted');
        
        client.publish('casa/set/mute', '0');
        
        const hasActiveAlarm = checkIfAnyAlarmActive();
        
        if (hasActiveAlarm) {
            playSiren(true);
            showStatusMessage('🔊 ALARME REATIVADO', false);
        } else {
            showStatusMessage('🔊 MUTE DESATIVADO', false);
        }
        
        console.log('🔊 MUTE DESATIVADO - casa/set/mute = 0');
    }
}

// ============================================
// FUNÇÃO CORRIGIDA: toggleSensor
// USANDO EXATAMENTE A MESMA LÓGICA DO SENSOR DE PRESENÇA
// ============================================
function toggleSensor(type) {
    // Inverte o estado do sensor
    sensorEnabled[type] = !sensorEnabled[type];
    
    // Atualiza o botão visualmente
    const btn = document.getElementById(type + 'Tgl');
    btn.innerText = sensorEnabled[type] ? "ON" : "OFF";
    
    if (sensorEnabled[type]) {
        btn.classList.remove('btn-off');
        btn.style.background = "#1f1f22";
    } else {
        btn.classList.add('btn-off');
    }
    
    // Define o tópico e valor baseado no tipo (MESMO PADRÃO DO PRESENÇA)
    let topic = '';
    let value = sensorEnabled[type] ? "1" : "0";
    
    switch(type) {
        case 'gas':
            topic = 'casa/set/gas_on';
            break;
        case 'temp':
            topic = 'casa/set/temp_on';
            break;
        case 'flow':
            topic = 'casa/set/flow_on';
            break;
        case 'press':
            topic = 'casa/set/press_on';
            break;
        case 'nivel':
            topic = 'casa/set/nivel_on';
            break;
        case 'pres':
            topic = 'casa/set/presenca_on';
            break;
    }
    
    // Publica o comando para o ESP32 (MESMO PADRÃO DO PRESENÇA)
    if (topic) {
        client.publish(topic, value);
        console.log(`📡 Sensor ${type} ${sensorEnabled[type] ? 'LIGADO' : 'DESLIGADO'} - ${topic} = ${value}`);
        showStatusMessage(`📡 ${type.toUpperCase()} ${sensorEnabled[type] ? 'LIGADO' : 'DESLIGADO'}`, false);
    }
    
    // Se desligou o sensor, remove o alarme visual imediatamente
    if (!sensorEnabled[type]) {
        document.getElementById(type + 'A').classList.remove('alarm-on');
    }
    
    // Pequeno delay para o ESP32 processar e depois reavalia as sirenes
    setTimeout(() => {
        checkSirenStatus();
    }, 150);
}

// ============================================
// FUNÇÃO: getGradientColor
// ============================================
function getGradientColor(percent) {
    percent = Math.min(1, Math.max(0, percent));
    let r, g, b;
    
    if (percent <= 0.5) {
        r = Math.floor(255 * (percent * 2));
        g = 255;
        b = 0;
    } else {
        r = 255;
        g = Math.floor(255 * (1 - (percent - 0.5) * 2));
        b = 0;
    }
    
    return `rgb(${r}, ${g}, ${b})`;
}

// ============================================
// FUNÇÃO: updateBarFill
// ============================================
function updateBarFill(barElement, currentValue, setpoint) {
    let percent = currentValue / setpoint;
    percent = Math.min(1, Math.max(0, percent));
    
    barElement.style.width = (percent * 100) + "%";
    barElement.style.background = `linear-gradient(90deg, ${getGradientColor(0)} 0%, ${getGradientColor(percent)} 100%)`;
}

// ============================================
// FUNÇÃO: initAudio
// ============================================
function initAudio() { 
    if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } 
}

// ============================================
// FUNÇÃO: toggleFullScreen
// ============================================
function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
        document.exitFullscreen();
    }
}

// ============================================
// FUNÇÃO: checkIfAnyAlarmActive
// CONSIDERA APENAS OS SENSORES QUE ESTÃO LIGADOS
// ============================================
function checkIfAnyAlarmActive() {
    let hasAlarm = false;
    
    // Verifica cada sensor individualmente
    const gasAlarm = document.getElementById('gasA').classList.contains('alarm-on');
    const tempAlarm = document.getElementById('tempA').classList.contains('alarm-on');
    const flowAlarm = document.getElementById('flowA').classList.contains('alarm-on');
    const pressAlarm = document.getElementById('pressA').classList.contains('alarm-on');
    const nivelAlarm = document.getElementById('nivelA').classList.contains('alarm-on');
    const presAlarm = document.getElementById('presA').classList.contains('alarm-on');
    
    // Só considera alarme se o sensor estiver LIGADO
    if (gasAlarm && sensorEnabled.gas) hasAlarm = true;
    if (tempAlarm && sensorEnabled.temp) hasAlarm = true;
    if (flowAlarm && sensorEnabled.flow) hasAlarm = true;
    if (pressAlarm && sensorEnabled.press) hasAlarm = true;
    if (nivelAlarm && sensorEnabled.nivel) hasAlarm = true;
    if (presAlarm && sensorEnabled.pres) hasAlarm = true;
    
    return hasAlarm;
}

// ============================================
// FUNÇÃO: checkSirenStatus
// ============================================
function checkSirenStatus() {
    const hasActiveAlarm = checkIfAnyAlarmActive();
    
    console.log(`🔔 Verificando sirene - Alarmes ativos: ${hasActiveAlarm}, Muted: ${isMuted}`);
    
    if (hasActiveAlarm) {
        if (!isMuted) {
            playSiren(true);
        } else {
            playSiren(false);
        }
    } else {
        playSiren(false);
    }
}

// ============================================
// FUNÇÃO: playSiren
// ============================================
function playSiren(on) {
    if (!on || isMuted) {
        if(sirenInterval) { 
            clearInterval(sirenInterval); 
            sirenInterval = null; 
        }
        return;
    }
    
    initAudio();
    
    if (!sirenInterval && audioCtx) {
        sirenInterval = setInterval(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = (Math.floor(Date.now()/400)%2==0) ? 950 : 650;
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); 
            osc.stop(audioCtx.currentTime + 0.4);
        }, 400);
    }
}

// ============================================
// MQTT: EVENTOS
// ============================================
client.on("connect", () => {
    document.getElementById('webLed').classList.add('online');
    showStatusMessage('✅ Conectado ao MQTT', false);
    console.log('✅ Conectado ao broker MQTT');
});

client.on("message", (t, m) => {
    document.getElementById('espLed').classList.add('online');
    clearTimeout(espTimeout);
    espTimeout = setTimeout(() => {
        document.getElementById('espLed').classList.remove('online');
    }, 2000);

    const val = m.toString();
    const num = parseFloat(val);
    const topic = t.toString();

    console.log(`📨 Recebido: ${topic} = ${val}`);

    // Processamento dos sensores
    if(topic.includes("gas") && !topic.includes("_on")) {
        const sp = parseInt(document.getElementById('s1').value) || 2000;
        const zero = parseInt(document.getElementById('s6').value) || 0;
        const real = Math.max(0, num - zero);
        document.getElementById('gasV').innerText = Math.floor(real).toString().padStart(4, '0');
        updateBarFill(document.getElementById('gasB'), real, sp);
        
        const isAlarm = (real >= sp);
        if (isAlarm) {
            console.log(`🚨 ALARME GÁS: ${real} >= ${sp}`);
        }
        document.getElementById('gasA').classList.toggle('alarm-on', isAlarm);
    } 
    else if(topic.includes("temp") && !topic.includes("_on")) {
        const sp = parseFloat(document.getElementById('s2').value) || 50;
        document.getElementById('tempV').innerText = num.toFixed(1);
        updateBarFill(document.getElementById('tempB'), num, sp);
        
        const isAlarm = (num >= sp);
        if (isAlarm) {
            console.log(`🚨 ALARME TEMP: ${num} >= ${sp}`);
        }
        document.getElementById('tempA').classList.toggle('alarm-on', isAlarm);
    } 
    else if(topic.includes("fluxo") && !topic.includes("_on")) {
        const sp = parseFloat(document.getElementById('s3').value) || 10;
        document.getElementById('flowV').innerText = num.toFixed(1);
        updateBarFill(document.getElementById('flowB'), num, sp);
        
        const isAlarm = (num >= sp);
        if (isAlarm) {
            console.log(`🚨 ALARME VAZÃO: ${num} >= ${sp}`);
        }
        document.getElementById('flowA').classList.toggle('alarm-on', isAlarm);
    } 
    else if(topic.includes("pressao") && !topic.includes("_on")) {
        const sp = parseFloat(document.getElementById('s4').value) || 4;
        document.getElementById('pressV').innerText = num.toFixed(2);
        updateBarFill(document.getElementById('pressB'), num, sp);
        
        const isAlarm = (num >= sp);
        if (isAlarm) {
            console.log(`🚨 ALARME PRESSÃO: ${num} >= ${sp}`);
        }
        document.getElementById('pressA').classList.toggle('alarm-on', isAlarm);
    } 
    else if(topic.includes("nivel") && !topic.includes("_on")) {
        const sp = parseFloat(document.getElementById('s5').value) || 80;
        document.getElementById('nivelV').innerText = num.toFixed(1);
        updateBarFill(document.getElementById('nivelB'), num, sp);
        
        const isAlarm = (num >= sp);
        if (isAlarm) {
            console.log(`🚨 ALARME NÍVEL: ${num} >= ${sp}`);
        }
        document.getElementById('nivelA').classList.toggle('alarm-on', isAlarm);
    } 
    else if(topic.includes("presenca") && !topic.includes("_on")) {
        const det = (val === "DETECTADO");
        document.getElementById('presV').innerText = det ? "ALERT" : "OK";
        document.getElementById('presV').style.color = det ? "#ff2d55" : "#00f5ff";
        
        if (det) {
            console.log(`🚨 ALARME PRESENÇA: DETECTADO`);
        }
        document.getElementById('presA').classList.toggle('alarm-on', det);
    }
    
    // Atualiza status das sirenes
    setTimeout(() => {
        checkSirenStatus();
    }, 50);
});

// Inscrições nos tópicos MQTT
client.subscribe([
    "casa/gas/vazamento",
    "casa/temp/ambiente",
    "casa/fluxo/agua",
    "casa/pressao/agua",
    "casa/nivel/caixa",
    "casa/presenca/status"
]);

// ============================================
// FUNÇÃO: save
// ============================================
function save() {
    const config = {s1:'gas', s2:'temp', s3:'fluxo', s4:'pressao', s5:'nivel', s6:'base'};
    for(let id in config) {
        const val = document.getElementById(id).value;
        localStorage.setItem('wellguard_v10_'+id, val);
        client.publish('casa/set/' + config[id], val);
    }
    document.getElementById('modal').style.display = 'none';
    showStatusMessage('✅ Configurações salvas', false);
}

// ============================================
// WINDOW.ONLOAD
// ============================================
window.onload = () => {
    const keys = ['s1','s2','s3','s4','s5','s6'];
    const defaults = [2000, 50, 10, 4, 80, 0];
    keys.forEach((k, i) => {
        document.getElementById(k).value = localStorage.getItem('wellguard_v10_'+k) || defaults[i];
    });
    
    // Sincroniza os botões com o estado inicial
    for (const [type, enabled] of Object.entries(sensorEnabled)) {
        const btn = document.getElementById(type + 'Tgl');
        if (btn) {
            btn.innerText = enabled ? "ON" : "OFF";
            if (!enabled) {
                btn.classList.add('btn-off');
            }
        }
    }
};

// ============================================
// FUNÇÃO: generatePDF
// ============================================
function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("RELATORIO WELLGUARD PRO X", 20, 20);
    doc.text(`Data: ${new Date().toLocaleString()}`, 20, 30);
    doc.text(`Gás: ${document.getElementById('gasV').innerText} PPM`, 20, 40);
    doc.text(`Temperatura: ${document.getElementById('tempV').innerText} °C`, 20, 50);
    doc.text(`Vazão: ${document.getElementById('flowV').innerText} L/m`, 20, 60);
    doc.text(`Pressão: ${document.getElementById('pressV').innerText} Bar`, 20, 70);
    doc.text(`Nível: ${document.getElementById('nivelV').innerText} %`, 20, 80);
    doc.text(`Presença: ${document.getElementById('presV').innerText}`, 20, 90);
    doc.save("WellGuard_Relatorio.pdf");
    showStatusMessage('📄 PDF gerado!', false);
}
</script>
