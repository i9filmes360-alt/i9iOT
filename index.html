<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WellGuard PRO X - v10.2 Control</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0a0b;
            --card: #141416;
            --vis-bg: #080808;
            --cyan: #00f5ff;
            --purple: #8b00ff;
            --red: #ff2d55;
            --green: #00ff9d;
            --btn-gray: #1f1f22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #ddd; padding: 5px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; }
        .header { background: #0d0d0f; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .header h1 { font-size: 0.85rem; font-weight: 900; color: var(--cyan); letter-spacing: 1px; }
        .status-area { display: flex; align-items: center; gap: 8px; }
        .led-group { display: flex; gap: 8px; align-items: center; }
        .led-item { font-size: 0.5rem; color: #666; text-align: center; }
        .led { width: 10px; height: 10px; border-radius: 50%; background: #222; margin: 0 auto 2px; border: 1px solid #000; }
        #webLed.online { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        #espLed.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .instrument-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
        .instrument { background: #18181a; border-radius: 12px; padding: 10px; border: 1px solid #252525; display: flex; flex-direction: column; }
        .label { font-size: 0.6rem; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .visor-interno { background: var(--vis-bg); border-radius: 8px; padding: 5px 10px; margin-bottom: 5px; border-top: 1px solid #000; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5); }
        .display { font-size: 1.6rem; font-weight: 700; font-family: 'Courier New', monospace; color: var(--cyan); text-align: right; }
        .bar-wrap { height: 4px; background: #000; border-radius: 5px; overflow: hidden; margin-top: 3px; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #00acc1, var(--green)); width: 0%; transition: 0.6s; }

        .card-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .alarm { width: 14px; height: 14px; border-radius: 50%; background: #111; border: 1px solid #000; }
        .alarm-on { background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        .btn-toggle { padding: 4px 8px; font-size: 0.55rem; background: #1f1f22; color: #fff; border: 1px solid #333; border-radius: 4px; font-weight: bold; cursor: pointer; min-width: 40px; }
        .btn-off { background: var(--red) !important; }

        .footer-btns { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button.btn-main { padding: 10px; font-weight: 700; border-radius: 8px; border: 1px solid #2a2a2a; cursor: pointer; font-size: 0.65rem; background: var(--btn-gray); color: #bbb; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #141416; padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; border: 1px solid #333; }
        input { width: 100%; padding: 8px; background: #080808; border: 1px solid #2a2a2a; color: var(--cyan); margin-bottom: 8px; border-radius: 5px; outline: none; }
        label { font-size: 0.6rem; color: #888; display: block; margin-top: 5px; }
    </style>
</head>
<body onclick="initAudio()">

<div class="container">
    <div class="header">
        <h1>WELLGUARD PRO X</h1>
        <div class="status-area">
            <button onclick="toggleFullScreen()" class="btn-main" style="padding: 5px 10px;">⛶</button>
            <div class="led-group">
                <div class="led-item"><div id="webLed" class="led"></div>WEB</div>
                <div class="led-item"><div id="espLed" class="led"></div>ESP</div>
            </div>
            <button id="muteBtn" onclick="toggleMute()" class="btn-main" style="padding: 5px 8px;">MUTE</button>
        </div>
    </div>

    <div class="instrument-grid">
        <!-- GÁS -->
        <div class="instrument">
            <div class="label">GÁS (PPM)</div>
            <div class="visor-interno"><div class="display" id="gasV">0000</div><div class="bar-wrap"><div id="gasB" class="bar-fill"></div></div></div>
            <div class="card-controls">
                <button id="gasTgl" onclick="toggleSensor('gas')" class="btn-toggle">ON</button>
                <div id="gasA" class="alarm"></div>
            </div>
        </div>

        <!-- TEMP -->
        <div class="instrument">
            <div class="label">TEMP (°C)</div>
            <div class="visor-interno"><div class="display" id="tempV">0.0</div><div class="bar-wrap"><div id="tempB" class="bar-fill"></div></div></div>
            <div class="card-controls">
                <button id="tempTgl" onclick="toggleSensor('temp')" class="btn-toggle">ON</button>
                <div id="tempA" class="alarm"></div>
            </div>
        </div>

        <!-- VAZÃO -->
        <div class="instrument">
            <div class="label">VAZÃO (L/M)</div>
            <div class="visor-interno"><div class="display" id="flowV">0.0</div><div class="bar-wrap"><div id="flowB" class="bar-fill"></div></div></div>
            <div class="card-controls">
                <button id="flowTgl" onclick="toggleSensor('flow')" class="btn-toggle">ON</button>
                <div id="flowA" class="alarm"></div>
            </div>
        </div>

        <!-- PRESSÃO -->
        <div class="instrument">
            <div class="label">PRESS (BAR)</div>
            <div class="visor-interno"><div class="display" id="pressV">0.00</div><div class="bar-wrap"><div id="pressB" class="bar-fill"></div></div></div>
            <div class="card-controls">
                <button id="pressTgl" onclick="toggleSensor('press')" class="btn-toggle">ON</button>
                <div id="pressA" class="alarm"></div>
            </div>
        </div>

        <!-- NÍVEL -->
        <div class="instrument">
            <div class="label">NÍVEL (%)</div>
            <div class="visor-interno"><div class="display" id="nivelV">0.0</div><div class="bar-wrap"><div id="nivelB" class="bar-fill"></div></div></div>
            <div class="card-controls">
                <button id="nivelTgl" onclick="toggleSensor('nivel')" class="btn-toggle">ON</button>
                <div id="nivelA" class="alarm"></div>
            </div>
        </div>

        <!-- PRESENÇA -->
        <div class="instrument">
            <div class="label">PRESENÇA</div>
            <div class="visor-interno"><div class="display" id="presV" style="text-align:center; font-size: 1.1rem;">OK</div></div>
            <div class="card-controls">
                <button id="presTgl" onclick="toggleSensor('pres')" class="btn-toggle">ON</button>
                <div id="presA" class="alarm"></div>
            </div>
        </div>
    </div>

    <div class="footer-btns">
        <button class="btn-main" onclick="generatePDF()">📄 PDF</button>
        <button class="btn-main" onclick="document.getElementById('modal').style.display='flex'">⚙️ CONFIG</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h4 style="color:var(--cyan); margin-bottom:10px; text-align:center;">PARÂMETROS</h4>
        <label>SP GÁS</label><input type="number" id="s1">
        <label>SP TEMP</label><input type="number" id="s2">
        <label>SP VAZÃO</label><input type="number" id="s3">
        <label>SP PRESS</label><input type="number" id="s4" step="0.1">
        <label>SP NÍVEL</label><input type="number" id="s5">
        <label>ZERO GÁS</label><input type="number" id="s6">
        <button onclick="save()" style="background:var(--purple); color:white; width:100%; margin-top:5px; padding:10px; border-radius:5px;">SALVAR</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="background:none; color:#888; width:100%; margin-top:5px; border:none;">VOLTAR</button>
    </div>
</div>

<script>
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt");
    let espTimeout = null, audioCtx = null, sirenInterval = null, isMuted = false;
    
    // Objeto para controlar o estado ON/OFF de cada sensor
    const sensorEnabled = {
        gas: true, temp: true, flow: true, press: true, nivel: true, pres: true
    };

    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    
    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('muteBtn').style.background = isMuted ? '#ff2d55' : '#1f1f22';
        if (isMuted && sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
    }

    // Função única para alternar sensores
    function toggleSensor(type) {
        sensorEnabled[type] = !sensorEnabled[type];
        const btn = document.getElementById(type + 'Tgl');
        btn.innerText = sensorEnabled[type] ? "ON" : "OFF";
        btn.classList.toggle('btn-off', !sensorEnabled[type]);
        
        // Se desligou o sensor, garante que o alarme dele apague na hora
        if (!sensorEnabled[type]) {
            document.getElementById(type + 'A').classList.remove('alarm-on');
        }
        
        // Envia para o hardware
        client.publish(`casa/set/${type}_on`, sensorEnabled[type] ? "1" : "0");
        checkSirenStatus();
    }

    function checkSirenStatus() {
        const alarms = document.querySelectorAll('.alarm-on');
        playSiren(alarms.length > 0);
    }

    function playSiren(on) {
        if (!on || isMuted) {
            if(sirenInterval) { clearInterval(sirenInterval); sirenInterval = null; }
            return;
        }
        initAudio();
        if (!sirenInterval && audioCtx) {
            sirenInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = (Math.floor(Date.now()/400)%2==0) ? 950 : 650;
                osc.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }, 400);
        }
    }

    client.on("connect", () => document.getElementById('webLed').classList.add('online'));

    client.on("message", (t, m) => {
        document.getElementById('espLed').classList.add('online');
        clearTimeout(espTimeout);
        espTimeout = setTimeout(() => document.getElementById('espLed').classList.remove('online'), 2000);

        const val = m.toString();
        const num = parseFloat(val);

        if(t.includes("gas")) {
            const sp = parseInt(document.getElementById('s1').value) || 2000;
            const real = Math.max(0, num - (parseInt(document.getElementById('s6').value)||0));
            document.getElementById('gasV').innerText = real.toString().padStart(4, '0');
            document.getElementById('gasB').style.width = Math.min((real/sp)*100, 100) + "%";
            document.getElementById('gasA').classList.toggle('alarm-on', real >= sp && sensorEnabled.gas);
        } else if(t.includes("temp")) {
            const sp = parseFloat(document.getElementById('s2').value) || 50;
            document.getElementById('tempV').innerText = num.toFixed(1);
            document.getElementById('tempB').style.width = Math.min((num/sp)*100, 100) + "%";
            document.getElementById('tempA').classList.toggle('alarm-on', num >= sp && sensorEnabled.temp);
        } else if(t.includes("fluxo")) {
            const sp = parseFloat(document.getElementById('s3').value) || 10;
            document.getElementById('flowV').innerText = num.toFixed(1);
            document.getElementById('flowB').style.width = Math.min((num/sp)*100, 100) + "%";
            document.getElementById('flowA').classList.toggle('alarm-on', num >= sp && sensorEnabled.flow);
        } else if(t.includes("pressao")) {
            const sp = parseFloat(document.getElementById('s4').value) || 4;
            document.getElementById('pressV').innerText = num.toFixed(2);
            document.getElementById('pressB').style.width = Math.min((num/sp)*100, 100) + "%";
            document.getElementById('pressA').classList.toggle('alarm-on', num >= sp && sensorEnabled.press);
        } else if(t.includes("nivel")) {
            const sp = parseFloat(document.getElementById('s5').value) || 80;
            document.getElementById('nivelV').innerText = num.toFixed(1);
            document.getElementById('nivelB').style.width = Math.min(num, 100) + "%";
            document.getElementById('nivelA').classList.toggle('alarm-on', num >= sp && sensorEnabled.nivel);
        } else if(t.includes("presenca")) {
            const det = (val === "DETECTADO");
            document.getElementById('presV').innerText = det ? "ALERT" : "OK";
            document.getElementById('presV').style.color = det ? "#ff2d55" : "#00f5ff";
            document.getElementById('presA').classList.toggle('alarm-on', det && sensorEnabled.pres);
        }
        checkSirenStatus();
    });

    client.subscribe(["casa/gas/vazamento", "casa/temp/ambiente", "casa/fluxo/agua", "casa/pressao/agua", "casa/nivel/caixa", "casa/presenca/status"]);

    function save() {
        const config = {s1:'gas', s2:'temp', s3:'fluxo', s4:'pressao', s5:'nivel', s6:'base'};
        for(let id in config) {
            const val = document.getElementById(id).value;
            localStorage.setItem('wellguard_v10_'+id, val);
            client.publish('casa/set/' + config[id], val);
        }
        document.getElementById('modal').style.display = 'none';
    }

    window.onload = () => {
        const keys = ['s1','s2','s3','s4','s5','s6'];
        const defaults = [2000, 50, 10, 4, 80, 0];
        keys.forEach((k, i) => document.getElementById(k).value = localStorage.getItem('wellguard_v10_'+k) || defaults[i]);
    };

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("RELATORIO WELLGUARD PRO X", 20, 20);
        doc.save("Relatorio.pdf");
    }
</script>
</body>
</html>
