<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do Radar - MQTT</title>
    <script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: normal;
        }

        /* Status de Conexão */
        .status-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 30px;
        }

        .status-item {
            flex: 1;
            text-align: center;
            padding: 15px 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-item .label {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .led {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 8px;
            transition: all 0.5s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .led.online {
            background: #22c55e;
            box-shadow: 0 0 30px #22c55e, inset 0 0 20px rgba(34, 197, 94, 0.3);
            border-color: #22c55e;
        }

        .led.offline {
            background: #ef4444;
            box-shadow: 0 0 30px #ef4444, inset 0 0 20px rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }

        .led.connecting {
            background: #eab308;
            box-shadow: 0 0 30px #eab308, inset 0 0 20px rgba(234, 179, 8, 0.3);
            border-color: #eab308;
            animation: pulse 1s infinite;
        }

        .led.unknown {
            background: #334155;
            border-color: #475569;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .status-text {
            font-size: 12px;
            color: #94a3b8;
        }

        .status-text.online {
            color: #22c55e;
        }

        .status-text.offline {
            color: #ef4444;
        }

        .status-text.connecting {
            color: #eab308;
        }

        /* Botão do Relé */
        .rele-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .rele-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #1a2a4a, #0a1525);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4),
                        inset 0 2px 4px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .rele-btn:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .rele-btn .led-indicator {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            transition: all 0.4s ease;
            background: #1a2a3a;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .rele-btn .led-indicator.on {
            background: #ff6b35;
            box-shadow: 0 0 50px #ff6b35, inset 0 0 20px rgba(255, 107, 53, 0.3);
        }

        .rele-btn .led-indicator.off {
            background: #1a2a3a;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .rele-btn .btn-label {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .rele-btn .btn-state {
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .rele-btn .btn-state.on {
            color: #ff6b35;
        }

        .rele-btn .btn-state.off {
            color: #475569;
        }

        .rele-hint {
            color: #64748b;
            font-size: 11px;
            margin-top: 12px;
            text-align: center;
        }

        /* Info Bar */
        .info-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 0;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: #64748b;
        }

        .info-bar .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-bar .mqtt-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .info-bar .dot.green {
            background: #22c55e;
        }

        .info-bar .dot.yellow {
            background: #eab308;
        }

        .info-bar .dot.red {
            background: #ef4444;
        }

        .info-bar .device-id {
            color: #475569;
            font-family: monospace;
            font-size: 10px;
        }

        .info-bar .broker-info {
            color: #475569;
            font-family: monospace;
            font-size: 10px;
        }

        /* Botão de reconectar */
        .reconnect-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .reconnect-btn:hover {
            background: #334155;
            color: #f8fafc;
        }

        /* Debug */
        .debug-log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            max-height: 80px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 10px;
            color: #64748b;
        }

        .debug-log .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .debug-log .log-entry.success {
            color: #22c55e;
        }

        .debug-log .log-entry.error {
            color: #ef4444;
        }

        .debug-log .log-entry.info {
            color: #38bdf8;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .status-container {
                flex-direction: row;
                gap: 10px;
            }

            .status-item {
                padding: 12px 8px;
            }

            .led {
                width: 40px;
                height: 40px;
            }

            .rele-btn {
                width: 150px;
                height: 150px;
            }

            .rele-btn .led-indicator {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🎛️ Controle do Radar
            <span class="subtitle">MQTT</span>
        </h1>

        <!-- Status de Conexão -->
        <div class="status-container">
            <div class="status-item">
                <span class="label">📡 Página Web</span>
                <div class="led online" id="pageLed"></div>
                <span class="status-text online" id="pageStatus">Online</span>
            </div>
            <div class="status-item">
                <span class="label">🔌 ESP32</span>
                <div class="led unknown" id="espLed"></div>
                <span class="status-text unknown" id="espStatus">Desconectado</span>
            </div>
        </div>

        <!-- Botão do Relé -->
        <div class="rele-container">
            <button class="rele-btn" id="releBtn">
                <div class="led-indicator off" id="releLed"></div>
                <div class="btn-label">💡 RELÉ</div>
                <div class="btn-state off" id="releState">DESLIGADO</div>
            </button>
            <div class="rele-hint">
                ⚡ Pressione e solte para alternar
            </div>
        </div>

        <!-- Info Bar -->
        <div class="info-bar">
            <div class="row">
                <div class="mqtt-info">
                    <span class="dot yellow" id="mqttDot"></span>
                    <span id="mqttStatus">Conectando...</span>
                </div>
                <button class="reconnect-btn" id="reconnectBtn">Reconectar</button>
            </div>
            <div class="row">
                <span class="broker-info" id="brokerInfo">broker.emqx.io:8083</span>
                <span class="device-id" id="deviceId">esp32_radar_rx</span>
            </div>
        </div>

        <!-- Debug Log -->
        <div class="debug-log" id="debugLog">
            <div class="log-entry info">🔄 Inicializando...</div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO MQTT ====================
        const MQTT_CONFIG = {
            broker: 'broker.emqx.io',
            port: 8083,  // WebSocket port
            clientId: `web_${Math.random().toString(16).substr(2, 8)}`,
            username: null,
            password: null,
            topics: {
                data: 'casa/radar/data',  // Dados do radar
                cmd: 'casa/radar/cmd'      // Comandos para o ESP
            },
            deviceId: 'esp32_radar_rx'
        };

        // ==================== ESTADO ====================
        let client = null;
        let isConnected = false;
        let isPressing = false;
        let relayState = false;
        let reconnectTimeout = null;
        let messageCount = 0;

        // ==================== ELEMENTOS DOM ====================
        const pageLed = document.getElementById('pageLed');
        const pageStatus = document.getElementById('pageStatus');
        const espLed = document.getElementById('espLed');
        const espStatus = document.getElementById('espStatus');
        const releBtn = document.getElementById('releBtn');
        const releLed = document.getElementById('releLed');
        const releState = document.getElementById('releState');
        const mqttDot = document.getElementById('mqttDot');
        const mqttStatus = document.getElementById('mqttStatus');
        const deviceId = document.getElementById('deviceId');
        const brokerInfo = document.getElementById('brokerInfo');
        const reconnectBtn = document.getElementById('reconnectBtn');
        const debugLog = document.getElementById('debugLog');

        // ==================== FUNÇÕES DE LOG ====================
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
            
            // Mantém apenas as últimas 20 mensagens
            while (debugLog.children.length > 20) {
                debugLog.removeChild(debugLog.firstChild);
            }
        }

        // ==================== FUNÇÕES UI ====================
        function updatePageConnection(status) {
            if (status === 'online') {
                pageLed.className = 'led online';
                pageStatus.textContent = 'Online';
                pageStatus.className = 'status-text online';
            } else {
                pageLed.className = 'led offline';
                pageStatus.textContent = 'Offline';
                pageStatus.className = 'status-text offline';
            }
        }

        function updateESPConnection(status) {
            if (status === 'online') {
                espLed.className = 'led online';
                espStatus.textContent = 'Online';
                espStatus.className = 'status-text online';
                addLog('✅ ESP32 conectado', 'success');
            } else if (status === 'connecting') {
                espLed.className = 'led connecting';
                espStatus.textContent = 'Conectando...';
                espStatus.className = 'status-text connecting';
            } else {
                espLed.className = 'led offline';
                espStatus.textContent = 'Desconectado';
                espStatus.className = 'status-text offline';
                addLog('❌ ESP32 desconectado', 'error');
            }
        }

        function updateRelay(state) {
            relayState = state;
            if (state) {
                releLed.className = 'led-indicator on';
                releState.textContent = 'LIGADO';
                releState.className = 'btn-state on';
                addLog('💡 Relé LIGADO', 'success');
            } else {
                releLed.className = 'led-indicator off';
                releState.textContent = 'DESLIGADO';
                releState.className = 'btn-state off';
                addLog('💡 Relé DESLIGADO', 'info');
            }
        }

        function updateMQTTStatus(status, text) {
            if (status === 'connected') {
                mqttDot.className = 'dot green';
                mqttStatus.textContent = text || 'Conectado';
                addLog('📡 MQTT Conectado', 'success');
            } else if (status === 'connecting') {
                mqttDot.className = 'dot yellow';
                mqttStatus.textContent = text || 'Conectando...';
                addLog('🔄 Conectando MQTT...', 'info');
            } else {
                mqttDot.className = 'dot red';
                mqttStatus.textContent = text || 'Desconectado';
                addLog('⚠️ MQTT Desconectado', 'error');
            }
        }

        // ==================== FUNÇÕES MQTT ====================
        function publishCommand(cmd) {
            if (!isConnected || !client) {
                addLog('❌ Não é possível enviar: MQTT desconectado', 'error');
                return false;
            }

            try {
                const message = new Paho.MQTT.Message(cmd);
                message.destinationName = MQTT_CONFIG.topics.cmd;
                message.retained = true;
                message.qos = 1;
                client.send(message);
                addLog(`📤 Comando enviado: ${cmd}`, 'info');
                return true;
            } catch (err) {
                addLog(`❌ Erro ao enviar: ${err.message}`, 'error');
                return false;
            }
        }

        function toggleRelay() {
            if (publishCommand('toggle')) {
                // Aguarda a confirmação via MQTT
            }
        }

        // ==================== EVENTOS DO BOTÃO ====================
        releBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (!isConnected) {
                addLog('⚠️ Clique no botão, mas MQTT não está conectado', 'error');
                return;
            }
            isPressing = true;
            addLog('👆 Botão pressionado (aguardando soltar...)', 'info');
        });

        releBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            if (isPressing) {
                isPressing = false;
                addLog('🖱️ Botão solto - enviando toggle', 'info');
                toggleRelay();
            }
        });

        releBtn.addEventListener('mouseleave', () => {
            if (isPressing) {
                isPressing = false;
                addLog('🖱️ Mouse saiu do botão', 'info');
            }
        });

        // Touch events
        releBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isConnected) {
                addLog('⚠️ Toque no botão, mas MQTT não está conectado', 'error');
                return;
            }
            isPressing = true;
            addLog('👆 Toque iniciado (aguardando soltar...)', 'info');
        });

        releBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isPressing) {
                isPressing = false;
                addLog('🖱️ Toque finalizado - enviando toggle', 'info');
                toggleRelay();
            }
        });

        releBtn.addEventListener('touchcancel', () => {
            isPressing = false;
            addLog('❌ Toque cancelado', 'info');
        });

        // ==================== MQTT CLIENT ====================
        function createMQTTClient() {
            client = new Paho.MQTT.Client(
                MQTT_CONFIG.broker,
                MQTT_CONFIG.port,
                MQTT_CONFIG.clientId
            );

            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            connectMQTT();
        }

        function connectMQTT() {
            if (client && client.isConnected()) {
                client.disconnect();
            }

            updateMQTTStatus('connecting', 'Conectando...');
            updatePageConnection('online');

            const connectOptions = {
                onSuccess: onConnect,
                onFailure: onConnectFailure,
                timeout: 10,
                keepAliveInterval: 30,
                mqttVersion: 4,
                cleanSession: true
            };

            try {
                addLog(`🔗 Conectando ao broker ${MQTT_CONFIG.broker}:${MQTT_CONFIG.port}...`, 'info');
                client.connect(connectOptions);
            } catch (err) {
                addLog(`❌ Erro ao conectar: ${err.message}`, 'error');
                onConnectFailure({ errorMessage: err.message });
            }
        }

        function onConnect() {
            addLog('✅ Conectado ao MQTT broker', 'success');
            isConnected = true;
            updateMQTTStatus('connected', 'Conectado');

            // Inscreve no tópico de dados
            try {
                client.subscribe(MQTT_CONFIG.topics.data, { qos: 1 });
                addLog(`📡 Inscrito em: ${MQTT_CONFIG.topics.data}`, 'info');
                
                // Envia comando para solicitar estado
                setTimeout(() => {
                    addLog('📤 Solicitando estado atual...', 'info');
                    publishCommand('status');
                }, 500);
            } catch (err) {
                addLog(`❌ Erro ao inscrever: ${err.message}`, 'error');
            }

            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
        }

        function onConnectFailure(error) {
            addLog(`❌ Falha na conexão: ${error.errorMessage || 'Erro desconhecido'}`, 'error');
            isConnected = false;
            updateMQTTStatus('disconnected', 'Falha na conexão');

            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
            }
            reconnectTimeout = setTimeout(() => {
                addLog('🔄 Tentando reconectar...', 'info');
                connectMQTT();
            }, 5000);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                addLog(`❌ Conexão perdida: ${responseObject.errorMessage || 'Erro desconhecido'}`, 'error');
                isConnected = false;
                updateMQTTStatus('disconnected', 'Conexão perdida');
                updateESPConnection('offline');

                if (reconnectTimeout) {
                    clearTimeout(reconnectTimeout);
                }
                reconnectTimeout = setTimeout(() => {
                    addLog('🔄 Tentando reconectar...', 'info');
                    connectMQTT();
                }, 3000);
            }
        }

        function onMessageArrived(message) {
            messageCount++;
            const payload = message.payloadString.trim();
            
            addLog(`📨 Mensagem #${messageCount} [${message.destinationName}]: ${payload}`, 'info');
            
            if (message.destinationName === MQTT_CONFIG.topics.data) {
                try {
                    // Tenta parsear como JSON
                    const data = JSON.parse(payload);
                    
                    // Atualiza estado do relé se presente
                    if (data.rele !== undefined) {
                        updateRelay(data.rele === 'on' || data.rele === true);
                    }
                    
                    // Atualiza se o ESP está online
                    if (data.status) {
                        updateESPConnection('online');
                    }
                    
                    // Se tiver dados do radar
                    if (data.rssi !== undefined) {
                        addLog(`📊 RSSI: ${data.rssi} dBm`, 'info');
                    }
                    
                } catch (e) {
                    // Se não for JSON, tenta como texto simples
                    if (payload === 'on' || payload === 'ON') {
                        updateRelay(true);
                        updateESPConnection('online');
                    } else if (payload === 'off' || payload === 'OFF') {
                        updateRelay(false);
                        updateESPConnection('online');
                    } else if (payload.includes('RSSI')) {
                        // Extrai RSSI se presente
                        const match = payload.match(/RSSI[:\s]+([-]?\d+)/i);
                        if (match) {
                            addLog(`📊 RSSI: ${match[1]} dBm`, 'info');
                        }
                        updateESPConnection('online');
                    } else {
                        addLog(`📨 Dados recebidos: ${payload}`, 'info');
                        updateESPConnection('online');
                    }
                }
            }
        }

        // ==================== RECONECTAR MANUAL ====================
        reconnectBtn.addEventListener('click', () => {
            addLog('🔄 Reconexão manual solicitada', 'info');
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }
            connectMQTT();
        });

        // ==================== INICIALIZAÇÃO ====================
        function init() {
            addLog('🚀 Iniciando controle MQTT...', 'info');
            addLog(`📡 Broker: ${MQTT_CONFIG.broker}:${MQTT_CONFIG.port}`, 'info');
            addLog(`📱 Client ID: ${MQTT_CONFIG.clientId}`, 'info');
            addLog(`📨 Tópico dados: ${MQTT_CONFIG.topics.data}`, 'info');
            addLog(`📤 Tópico comando: ${MQTT_CONFIG.topics.cmd}`, 'info');
            addLog(`🔌 Device ID: ${MQTT_CONFIG.deviceId}`, 'info');

            deviceId.textContent = MQTT_CONFIG.deviceId;
            brokerInfo.textContent = `${MQTT_CONFIG.broker}:${MQTT_CONFIG.port}`;
            updatePageConnection('online');

            createMQTTClient();

            // Verifica periodicamente a conexão
            setInterval(() => {
                if (!isConnected && client) {
                    updateMQTTStatus('disconnected', 'Desconectado');
                }
            }, 5000);
        }

        init();

        window.addEventListener('beforeunload', () => {
            if (client && isConnected) {
                try {
                    client.disconnect();
                    addLog('🔌 Desconectado', 'info');
                } catch (e) {}
            }
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
            }
        });

        addLog('✅ Página carregada com sucesso!', 'success');
    </script>
</body>
</html>
