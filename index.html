<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Controle Relé ESP32</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --on: #22c55e;
      --off: #ef4444;
      --shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .ip-group {
      margin-bottom: 28px;
      text-align: left;
    }

    .ip-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .ip-row {
      display: flex;
      gap: 8px;
    }

    .ip-row input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .ip-row input:focus {
      border-color: var(--accent);
    }

    .ip-row button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .ip-row button:active {
      opacity: 0.8;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 1rem;
      font-weight: 500;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.on {
      background: var(--on);
      box-shadow: 0 0 12px var(--on);
    }

    .status-dot.off {
      background: var(--off);
      box-shadow: 0 0 12px var(--off);
    }

    .btn-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 24px;
    }

    .btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #334155, #1e293b);
      box-shadow: 
        8px 8px 20px #0b1220,
        -8px -8px 20px #2a3a52,
        inset 0 0 0 1px rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
      outline: none;
    }

    .btn:active {
      transform: scale(0.94);
      box-shadow: 
        4px 4px 12px #0b1220,
        -4px -4px 12px #2a3a52,
        inset 2px 2px 8px #0b1220;
    }

    .btn.on {
      background: linear-gradient(145deg, #16a34a, #15803d);
      box-shadow: 
        8px 8px 20px #0b1220,
        -8px -8px 20px #2a3a52,
        0 0 30px rgba(34, 197, 94, 0.4);
    }

    .btn.on:active {
      box-shadow: 
        4px 4px 12px #0b1220,
        -4px -4px 12px #2a3a52,
        0 0 20px rgba(34, 197, 94, 0.3);
    }

    .btn svg {
      width: 48px;
      height: 48px;
      fill: #94a3b8;
      transition: fill 0.3s;
    }

    .btn.on svg {
      fill: #fff;
    }

    .btn-label {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      transition: color 0.3s;
    }

    .btn-label.on {
      color: var(--on);
    }

    .feedback {
      min-height: 24px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .feedback.error {
      color: var(--off);
    }

    .feedback.ok {
      color: var(--on);
    }

    footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle do Relé</h1>
    <p class="subtitle">ESP32 • Toque e solte para alternar</p>

    <div class="card">
      <div class="ip-group">
        <label for="ip">Endereço do ESP32</label>
        <div class="ip-row">
          <input type="text" id="ip" placeholder="http://192.168.0.100" autocomplete="off" />
          <button id="saveIp">Salvar</button>
        </div>
      </div>

      <div class="status">
        <div class="status-dot" id="dot"></div>
        <span id="statusText">Desconhecido</span>
      </div>

      <div class="btn-wrapper">
        <button class="btn" id="toggleBtn" aria-label="Alternar relé">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2a1 1 0 0 1 1 1v8a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 0 1.414 7 7 0 1 0-9.9 9.9 1 1 0 1 1-1.414 1.414 9 9 0 1 1 12.728-12.728 1 1 0 0 1-1.414 0z"/>
          </svg>
        </button>
      </div>

      <div class="btn-label" id="btnLabel">TOQUE PARA ALTERNAR</div>
      <div class="feedback" id="feedback"></div>
    </div>

    <footer>
      Página pronta para GitHub Pages
    </footer>
  </div>

  <script>
    const ipInput = document.getElementById('ip');
    const saveBtn = document.getElementById('saveIp');
    const toggleBtn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    const btnLabel = document.getElementById('btnLabel');
    const feedback = document.getElementById('feedback');
    const dot = document.getElementById('dot');

    const savedIp = localStorage.getItem('esp32_ip') || 'http://192.168.0.100';
    ipInput.value = savedIp;

    let isOn = false;
    let busy = false;

    function getBaseUrl() {
      let url = ipInput.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      return url.replace(/\/$/, '');
    }

    function setFeedback(msg, type = '') {
      feedback.textContent = msg;
      feedback.className = 'feedback ' + type;
    }

    function updateUI(state) {
      isOn = state;
      if (state) {
        toggleBtn.classList.add('on');
        btnLabel.classList.add('on');
        btnLabel.textContent = 'RELÉ LIGADO';
        statusText.textContent = 'Ligado';
        dot.className = 'status-dot on';
      } else {
        toggleBtn.classList.remove('on');
        btnLabel.classList.remove('on');
        btnLabel.textContent = 'RELÉ DESLIGADO';
        statusText.textContent = 'Desligado';
        dot.className = 'status-dot off';
      }
    }

    async function fetchStatus() {
      try {
        const res = await fetch(getBaseUrl() + '/status', { cache: 'no-store' });
        if (!res.ok) throw new Error('Erro na resposta');
        const data = await res.json();
        updateUI(data.state === true || data.state === 'on' || data.state === 1);
        setFeedback('Conectado', 'ok');
      } catch (e) {
        setFeedback('Não foi possível conectar ao ESP32', 'error');
        statusText.textContent = 'Offline';
        dot.className = 'status-dot';
      }
    }

    async function toggleRelay() {
      if (busy) return;
      busy = true;
      setFeedback('Enviando comando...');

      try {
        const res = await fetch(getBaseUrl() + '/toggle', { method: 'GET', cache: 'no-store' });
        if (!res.ok) throw new Error('Falha no comando');
        const data = await res.json();
        updateUI(data.state === true || data.state === 'on' || data.state === 1);
        setFeedback('Comando enviado!', 'ok');
      } catch (e) {
        setFeedback('Erro ao enviar comando. Verifique o IP e a rede.', 'error');
      } finally {
        busy = false;
      }
    }

    saveBtn.addEventListener('click', () => {
      localStorage.setItem('esp32_ip', ipInput.value.trim());
      setFeedback('IP salvo!', 'ok');
      fetchStatus();
    });

    toggleBtn.addEventListener('click', toggleRelay);

    fetchStatus();
    setInterval(fetchStatus, 4000);
  </script>
</body>
</html>
