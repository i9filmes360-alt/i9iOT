<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Controle Relé ESP32</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --on: #22c55e;
      --off: #ef4444;
      --shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .leds {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
    }
    .led-item {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }
    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #334155;
      margin: 0 auto 4px;
      transition: all 0.3s;
    }
    .led.online {
      background: var(--on);
      box-shadow: 0 0 10px var(--on);
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 1rem;
      font-weight: 500;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.on {
      background: var(--on);
      box-shadow: 0 0 12px var(--on);
    }
    .status-dot.off {
      background: var(--off);
      box-shadow: 0 0 12px var(--off);
    }
    .btn-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
    }
    .btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #334155, #1e293b);
      box-shadow:
        8px 8px 20px #0b1220,
        -8px -8px 20px #2a3a52,
        inset 0 0 0 1px rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      outline: none;
    }
    .btn:active {
      transform: scale(0.94);
    }
    .btn.on {
      background: linear-gradient(145deg, #16a34a, #15803d);
      box-shadow:
        8px 8px 20px #0b1220,
        -8px -8px 20px #2a3a52,
        0 0 30px rgba(34, 197, 94, 0.4);
    }
    .btn svg {
      width: 48px;
      height: 48px;
      fill: #94a3b8;
      transition: fill 0.3s;
    }
    .btn.on svg {
      fill: #fff;
    }
    .btn-label {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      transition: color 0.3s;
      margin-bottom: 8px;
    }
    .btn-label.on {
      color: var(--on);
    }
    .feedback {
      min-height: 22px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .feedback.error { color: var(--off); }
    .feedback.ok { color: var(--on); }
    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle do Relé</h1>
    <p class="subtitle">ESP32 • MQTT • Funciona de qualquer lugar</p>

    <div class="card">
      <div class="leds">
        <div class="led-item">
          <div id="webLed" class="led"></div>
          WEB
        </div>
        <div class="led-item">
          <div id="espLed" class="led"></div>
          ESP
        </div>
      </div>

      <div class="status">
        <div class="status-dot" id="dot"></div>
        <span id="statusText">Aguardando...</span>
      </div>

      <div class="btn-wrapper">
        <button class="btn" id="toggleBtn" aria-label="Alternar relé">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2a1 1 0 0 1 1 1v8a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm5.657 3.343a1 1 0 0 1 0 1.414 7 7 0 1 0-9.9 9.9 1 1 0 1 1-1.414 1.414 9 9 0 1 1 12.728-12.728 1 1 0 0 1-1.414 0z"/>
          </svg>
        </button>
      </div>

      <div class="btn-label" id="btnLabel">TOQUE PARA ALTERNAR</div>
      <div class="feedback" id="feedback"></div>
    </div>

    <footer>
      MQTT • broker.emqx.io • Página no GitHub Pages
    </footer>
  </div>

  <script>
    // ============ MQTT ============
    const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
      clientId: "web_rele_" + Math.random().toString(16).substr(2, 8)
    });

    const topicStatus = "casa/rele/status";
    const topicCmd    = "casa/rele/cmd";

    let isOn = false;
    let busy = false;
    let espTimeout = null;

    const toggleBtn  = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    const btnLabel   = document.getElementById('btnLabel');
    const feedback   = document.getElementById('feedback');
    const dot        = document.getElementById('dot');
    const webLed     = document.getElementById('webLed');
    const espLed     = document.getElementById('espLed');

    function setFeedback(msg, type = '') {
      feedback.textContent = msg;
      feedback.className = 'feedback ' + type;
    }

    function updateUI(state) {
      isOn = state;
      if (state) {
        toggleBtn.classList.add('on');
        btnLabel.classList.add('on');
        btnLabel.textContent = 'RELÉ LIGADO';
        statusText.textContent = 'Ligado';
        dot.className = 'status-dot on';
      } else {
        toggleBtn.classList.remove('on');
        btnLabel.classList.remove('on');
        btnLabel.textContent = 'RELÉ DESLIGADO';
        statusText.textContent = 'Desligado';
        dot.className = 'status-dot off';
      }
    }

    // Conexão Web
    client.on("connect", () => {
      webLed.classList.add('online');
      setFeedback('Conectado ao broker', 'ok');
      client.subscribe(topicStatus);
    });

    client.on("reconnect", () => {
      webLed.classList.remove('online');
      setFeedback('Reconectando...', '');
    });

    client.on("error", (err) => {
      console.error(err);
      setFeedback('Erro de conexão MQTT', 'error');
    });

    // Mensagens do ESP
    client.on("message", (topic, message) => {
      const msg = message.toString().toLowerCase().trim();

      // Marca que o ESP está online
      espLed.classList.add('online');
      clearTimeout(espTimeout);
      espTimeout = setTimeout(() => {
        espLed.classList.remove('online');
        statusText.textContent = 'ESP Offline';
        dot.className = 'status-dot';
      }, 8000); // se não receber nada em 8s considera offline

      if (topic === topicStatus) {
        updateUI(msg === "on" || msg === "1");
        setFeedback('Estado atualizado', 'ok');
      }
    });

    // Botão de toggle
    toggleBtn.addEventListener('click', () => {
      if (busy) return;
      if (!client.connected) {
        setFeedback('Web offline', 'error');
        return;
      }

      busy = true;
      setFeedback('Enviando comando...');

      client.publish(topicCmd, "toggle");

      setTimeout(() => {
        busy = false;
        setFeedback('Comando enviado!', 'ok');
      }, 600);
    });

    // Estado inicial
    setFeedback('Conectando...', '');
  </script>
</body>
</html>
