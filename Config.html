<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVA RADAR - Configuração de Rede BLE</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 420px; background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
    h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 15px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.85rem; }
    .btn { width: 100%; padding: 12px; background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 0.9rem; }
    .btn:active { opacity: 0.8; }
    #status { margin-top: 15px; font-size: 0.8rem; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h2>EVA RADAR - Configuração BLE</h2>
    <div class="form-group">
      <label>Nome do Wi-Fi (SSID)</label>
      <input type="text" id="ssid" placeholder="Ex: MinhaRede">
    </div>
    <div class="form-group">
      <label>Senha do Wi-Fi</label>
      <input type="password" id="pass" placeholder="Senha do Wi-Fi">
    </div>
    <button class="btn" onclick="enviarCredenciaisBLE()">Conectar BLE e Enviar</button>
    <div id="status">Status: Desconectado</div>
  </div>

  <script>
    // UUIDs padrão do serviço e característica BLE dos ESP32
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function enviarCredenciaisBLE() {
      const ssid = document.getElementById('ssid').value;
      const pass = document.getElementById('pass').value;
      const statusDiv = document.getElementById('status');

      if (!ssid) {
        alert("Preencha o nome da rede (SSID)!");
        return;
      }

      try {
        statusDiv.innerText = "Buscando dispositivos BLE...";
        
        // Solicita o dispositivo BLE no navegador
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'EVA_RADAR_' }],
          optionalServices: [SERVICE_UUID]
        });

        statusDiv.innerText = `Conectando a ${device.name}...`;
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // Formata as credenciais em JSON
        const payload = JSON.stringify({ ssid: ssid, pass: pass });
        const encoder = new TextEncoder();

        statusDiv.innerText = "Enviando credenciais...";
        await characteristic.writeValue(encoder.encode(payload));

        statusDiv.innerText = "Credenciais enviadas! Dispositivo reiniciando...";
        await device.gatt.disconnect();
      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Erro: " + error.message;
      }
    }
  </script>
</body>
</html>
